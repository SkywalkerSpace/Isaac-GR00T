# Each profile binds one demonstration dataset to its matching Isaac Lab task.
# Add one entry per robot/task pair. Tags must be unique and start with
# "isaaclab_" so N1.7 can assign each embodiment a separate model ID.
profiles:
  - name: pick_place_gr1t2
    embodiment_tag: isaaclab_custom_pick_place
    environment_id: IsaacContrib-PickPlace-GR1T2-GR00T-Abs-Mimic-v0
    hdf5_inputs:
      - ./datasets/generated_dataset_gr1t2.hdf5
    lerobot_dataset: ./datasets/isaaclab_pick_place_gr1t2
    checkpoint: ./outputs/isaaclab_multi_robot
    task_description: Pick up the object and place it into the target container.
    fps: 20
    action_horizon: 16
    # `actions` are the absolute wrist poses + hand targets consumed by env.step().
    # `processed_actions` from the Pink IK recorder are solved arm joint targets.
    action_source: actions
    require_success: true
    mix_ratio: 1.0
    action_fields:
      # Indices follow the original 36-D environment action order. The policy
      # groups each hand's joints together; rollout scatters them back before
      # calling env.step().
      left_arm: [0, 1, 2, 3, 4, 5, 6]
      right_arm: [7, 8, 9, 10, 11, 12, 13]
      left_hand: [14, 15, 16, 17, 18, 24, 25, 26, 27, 28, 34]
      right_hand: [19, 20, 21, 22, 23, 29, 30, 31, 32, 33, 35]
    state_fields:
      left_arm: [left_eef_pos, left_eef_quat]
      right_arm: [right_eef_pos, right_eef_quat]
      # Isaac Lab reports the hand state in [right, left] joint order.
      left_hand:
        - field: hand_joint_state
          slice: [11, 22]
      right_hand:
        - field: hand_joint_state
          slice: [0, 11]
    state_sin_cos_embedding_keys: [left_arm, right_arm, left_hand, right_hand]
    camera_fields:
      robot_pov_cam: robot_pov_cam
      left_wrist_cam: left_wrist_cam
      right_wrist_cam: right_wrist_cam

